name: Docker

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "test_data/**"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Least-privilege default; jobs that need more declare their own permissions
# (Scorecard Token-Permissions).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ${{ vars.RUST_TEMPLATE_DOCKERHUB_NAMESPACE || 'threatflux' }}
  # GHCR is always published. Docker Hub is opt-in: set the repository or
  # organization variable RUST_TEMPLATE_PUBLISH_DOCKERHUB to 'true' (see
  # docs/RELEASING.md). Unset or 'false' publishes to GHCR only.
  PUBLISH_DOCKERHUB: ${{ vars.RUST_TEMPLATE_PUBLISH_DOCKERHUB || 'false' }}
  DOCKER_BUILDKIT: 1
  BINARY_NAME: ${{ vars.RUST_TEMPLATE_BINARY_NAME || 'openai_rust_sdk' }}
  BINARY_PACKAGE: ${{ vars.RUST_TEMPLATE_BINARY_PACKAGE || '' }}
  CLI_NAME: ${{ vars.RUST_TEMPLATE_CLI_NAME || 'openai-rust-sdk' }}
  SBOM_MANIFEST_PATH: ${{ vars.RUST_TEMPLATE_SBOM_MANIFEST_PATH || 'Cargo.toml' }}
  OCI_IMAGE_TITLE: OpenAI Rust SDK
  OCI_IMAGE_DESCRIPTION: Batch JSONL generation and local YARA-X validation CLI
  OCI_IMAGE_VENDOR: ThreatFlux
  OCI_IMAGE_SOURCE: https://github.com/threatflux/openai_rust_sdk

jobs:
  # The image is published for linux/amd64 and linux/arm64. Each platform is
  # built natively on its own runner (no QEMU emulation, which would make the
  # YARA-X and wasmtime build take hours) and pushed by digest; the merge job
  # then publishes one multi-arch index under every tag.
  build:
    name: Build Docker Image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.arch == 'arm64' && (vars.RUST_TEMPLATE_RUNNER_UBUNTU_ARM || 'ubuntu-24.04-arm') || (vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest') }}
    permissions:
      contents: read
      packages: write # Push the per-platform image and the base image to GHCR.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Docker Hub credentials are read only when publishing there is
      # switched on; without them the run warns and publishes to GHCR alone.
      - name: Check Docker Hub credentials
        id: dockerhub
        if: github.event_name != 'pull_request' && env.PUBLISH_DOCKERHUB == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RUST_TEMPLATE_PUBLISH_DOCKERHUB is 'true' but DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set; publishing to GHCR only"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # GHCR is always a target; Docker Hub only when the check above passed.
      - name: Image names
        id: names
        env:
          DOCKERHUB_ENABLED: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          image_name="${GITHUB_REPOSITORY,,}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          ghcr_image="${REGISTRY}/${image_name}"
          dockerhub_image=""
          push_names="${ghcr_image}"
          if [[ "${DOCKERHUB_ENABLED}" == "true" ]]; then
            dockerhub_image="${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/$(tr '[:upper:]_' '[:lower:]-' <<< "${repo_name}")"
            push_names+=",${dockerhub_image}"
          fi
          {
            echo "image_name=${image_name}"
            echo "ghcr_image=${ghcr_image}"
            echo "dockerhub_image=${dockerhub_image}"
            echo "dockerhub_enabled=${DOCKERHUB_ENABLED}"
            echo "push_names=${push_names}"
            echo "images<<EOF"
            echo "${ghcr_image}"
            if [[ -n "${dockerhub_image}" ]]; then
              echo "${dockerhub_image}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Detect Rust base image version
        id: rust_base
        run: |
          RUST_BASE_VERSION="$(sed -n 's/^FROM rust:\([0-9][0-9.]*\)[^@ ]*@sha256:[^ ]* AS rust-base$/\1/p' Dockerfile | sed -n '1p')"
          if [ -z "${RUST_BASE_VERSION}" ]; then
            echo "Unable to detect the pinned Rust base image version" >&2
            exit 1
          fi
          echo "version=${RUST_BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.names.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Labels only: tags are applied to the multi-arch index in the merge job.
      - name: Extract runtime metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.images }}
          labels: |
            org.opencontainers.image.title=${{ env.OCI_IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.OCI_IMAGE_DESCRIPTION }}
            org.opencontainers.image.vendor=${{ env.OCI_IMAGE_VENDOR }}
            org.opencontainers.image.source=${{ env.OCI_IMAGE_SOURCE }}
            maintainer=ThreatFlux

      - name: Extract base image metadata
        id: base_meta
        if: github.event_name != 'pull_request' && matrix.arch == 'amd64'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=raw,value=base-rust-${{ steps.rust_base.outputs.version }}
            type=raw,value=base-rust-latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ env.OCI_IMAGE_TITLE }} Rust Base
            org.opencontainers.image.description=Rust ${{ steps.rust_base.outputs.version }} base image for ${{ env.OCI_IMAGE_TITLE }}
            org.opencontainers.image.vendor=${{ env.OCI_IMAGE_VENDOR }}
            org.opencontainers.image.source=${{ env.OCI_IMAGE_SOURCE }}

      # The Rust base image stays linux/amd64, as before; only the runtime
      # image is published for both platforms.
      - name: Build base image
        if: github.event_name != 'pull_request' && matrix.arch == 'amd64'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: rust-base
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.base_meta.outputs.tags }}
          labels: ${{ steps.base_meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            CLI_NAME=${{ env.CLI_NAME }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            OCI_IMAGE_TITLE=${{ env.OCI_IMAGE_TITLE }}
            OCI_IMAGE_DESCRIPTION=${{ env.OCI_IMAGE_DESCRIPTION }}
            OCI_IMAGE_VENDOR=${{ env.OCI_IMAGE_VENDOR }}
            OCI_IMAGE_SOURCE=${{ env.OCI_IMAGE_SOURCE }}

      - name: Build and export (PRs)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.names.outputs.image_name }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            CLI_NAME=${{ env.CLI_NAME }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            OCI_IMAGE_TITLE=${{ env.OCI_IMAGE_TITLE }}
            OCI_IMAGE_DESCRIPTION=${{ env.OCI_IMAGE_DESCRIPTION }}
            OCI_IMAGE_VENDOR=${{ env.OCI_IMAGE_VENDOR }}
            OCI_IMAGE_SOURCE=${{ env.OCI_IMAGE_SOURCE }}

      # Pushed untagged, by digest, to GHCR (and Docker Hub when enabled); the
      # merge job tags the multi-arch index that references every platform's
      # digest.
      - name: Build and push runtime image by digest (non-PR)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ steps.names.outputs.push_names }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            CLI_NAME=${{ env.CLI_NAME }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            OCI_IMAGE_TITLE=${{ env.OCI_IMAGE_TITLE }}
            OCI_IMAGE_DESCRIPTION=${{ env.OCI_IMAGE_DESCRIPTION }}
            OCI_IMAGE_VENDOR=${{ env.OCI_IMAGE_VENDOR }}
            OCI_IMAGE_SOURCE=${{ env.OCI_IMAGE_SOURCE }}

      - name: Export image digest (non-PR)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected image digest '${DIGEST}'"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload image digest (non-PR)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload image artifact (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish Multi-Arch Image
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write # Push the multi-arch index and its tags to GHCR.
    # No image names here: a job output that contains a secret's value is
    # dropped, and a Docker Hub organization access token logs in as the
    # organization, so DOCKERHUB_USERNAME can equal the owner in every name.
    # Downstream jobs derive the names from GITHUB_REPOSITORY instead.
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      dockerhub_enabled: ${{ steps.names.outputs.dockerhub_enabled }}
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # Same two steps as in the build job, so both jobs reach the same
      # decision from the same variable and secrets.
      - name: Check Docker Hub credentials
        id: dockerhub
        if: github.event_name != 'pull_request' && env.PUBLISH_DOCKERHUB == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RUST_TEMPLATE_PUBLISH_DOCKERHUB is 'true' but DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set; publishing to GHCR only"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Image names
        id: names
        env:
          DOCKERHUB_ENABLED: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          image_name="${GITHUB_REPOSITORY,,}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          ghcr_image="${REGISTRY}/${image_name}"
          dockerhub_image=""
          push_names="${ghcr_image}"
          if [[ "${DOCKERHUB_ENABLED}" == "true" ]]; then
            dockerhub_image="${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/$(tr '[:upper:]_' '[:lower:]-' <<< "${repo_name}")"
            push_names+=",${dockerhub_image}"
          fi
          {
            echo "image_name=${image_name}"
            echo "ghcr_image=${ghcr_image}"
            echo "dockerhub_image=${dockerhub_image}"
            echo "dockerhub_enabled=${DOCKERHUB_ENABLED}"
            echo "push_names=${push_names}"
            echo "images<<EOF"
            echo "${ghcr_image}"
            if [[ -n "${dockerhub_image}" ]]; then
              echo "${dockerhub_image}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.names.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract runtime metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # One index per registry, built from the platform digests pushed to that
      # same registry, so no blob has to be copied between registries.
      - name: Create and push multi-arch index
        env:
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr_image }}
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub_image }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          mapfile -t digests < <(find "${DIGESTS_DIR}" -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "::error::Expected 2 platform digests (amd64, arm64), found ${#digests[@]}"
            exit 1
          fi
          images=("${GHCR_IMAGE}")
          if [[ -n "${DOCKERHUB_IMAGE}" ]]; then
            images+=("${DOCKERHUB_IMAGE}")
          fi
          for image in "${images[@]}"; do
            mapfile -t tags < <(jq -r --arg image "${image}" '.tags[] | select(startswith($image + ":"))' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
            if [[ "${#tags[@]}" -eq 0 ]]; then
              echo "::error::No tags computed for ${image}"
              exit 1
            fi
            args=()
            for tag in "${tags[@]}"; do
              args+=(--tag "${tag}")
            done
            for digest in "${digests[@]}"; do
              args+=("${image}@sha256:${digest}")
            done
            docker buildx imagetools create "${args[@]}"
          done

      - name: Inspect multi-arch index
        id: index
        env:
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr_image }}
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub_image }}
        run: |
          set -euo pipefail
          # Every run tags the short commit SHA; scan and test pull the same tag.
          ref="${GHCR_IMAGE}:${GITHUB_SHA::7}"
          docker buildx imagetools inspect "${ref}"
          manifest="$(docker buildx imagetools inspect "${ref}" --format '{{ json .Manifest }}')"
          digest="$(jq -r '.digest' <<< "${manifest}")"
          platforms="$(jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")' <<< "${manifest}")"
          if [[ "${platforms}" != "linux/amd64,linux/arm64" ]]; then
            echo "::error::${ref} lists platforms '${platforms}', expected linux/amd64,linux/arm64"
            exit 1
          fi
          # The sign job signs Docker Hub at the GHCR digest, so both indexes
          # must be byte-identical (same platform digests, same order).
          if [[ -n "${DOCKERHUB_IMAGE}" ]]; then
            dockerhub_ref="${DOCKERHUB_IMAGE}:${GITHUB_SHA::7}"
            dockerhub_digest="$(docker buildx imagetools inspect "${dockerhub_ref}" --format '{{ json .Manifest }}' | jq -r '.digest')"
            if [[ "${dockerhub_digest}" != "${digest}" ]]; then
              echo "::error::${dockerhub_ref} is ${dockerhub_digest}, expected the GHCR index digest ${digest}"
              exit 1
            fi
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${GHCR_IMAGE}@${digest} for ${platforms}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${DOCKERHUB_IMAGE}" ]]; then
            echo "Published ${DOCKERHUB_IMAGE}@${digest} for ${platforms}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Docker Hub not published: RUST_TEMPLATE_PUBLISH_DOCKERHUB is not 'true' or its credentials are missing" >> "$GITHUB_STEP_SUMMARY"
          fi

  scan:
    name: Security Scan
    needs: [build, merge]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (github.event_name == 'pull_request' || needs.merge.result == 'success')
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read # Pull the pushed image from GHCR.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image-amd64
          path: ${{ runner.temp }}

      - name: Load image (PRs)
        if: github.event_name == 'pull_request'
        run: docker load -i "${RUNNER_TEMP}/image.tar"

      - name: Image reference
        id: image
        run: |
          image_name="${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "ref=${image_name}:scan" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${REGISTRY}/${image_name}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker pull --platform linux/amd64 "${IMAGE}"

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          vuln-type: os,library
          trivyignores: .trivyignore
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
        if: always() && hashFiles('trivy-results.sarif') != ''

  test:
    name: Test Docker Image (${{ matrix.arch }})
    needs: [build, merge]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (github.event_name == 'pull_request' || needs.merge.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    # Each platform's image runs natively on a runner of that architecture.
    runs-on: ${{ matrix.arch == 'arm64' && (vars.RUST_TEMPLATE_RUNNER_UBUNTU_ARM || 'ubuntu-24.04-arm') || (vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest') }}
    permissions:
      contents: read
      packages: read # Pull the pushed image from GHCR.
    steps:
      - name: Download image (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Load image (PRs)
        if: github.event_name == 'pull_request'
        run: docker load -i "${RUNNER_TEMP}/image.tar"

      - name: Image reference
        id: image
        run: |
          image_name="${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "ref=${image_name}:scan" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${REGISTRY}/${image_name}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          PLATFORM: linux/${{ matrix.arch }}
        run: docker pull --platform "${PLATFORM}" "${IMAGE}"

      - name: Test image startup
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image_arch="$(docker image inspect --format '{{ .Architecture }}' "${IMAGE}")"
          if [[ "${image_arch}" != "${ARCH}" ]]; then
            echo "Image architecture is '${image_arch}', expected '${ARCH}'" >&2
            exit 1
          fi
          docker run --rm "${IMAGE}" --version
          docker run --rm "${IMAGE}" --help > /dev/null
          docker run --rm "${IMAGE}" validate-rule --help > /dev/null
          # The runtime is distroless (no shell), so check the non-root user
          # and the embedded SBOM from outside the container.
          image_user="$(docker image inspect --format '{{ .Config.User }}' "${IMAGE}")"
          if [[ "${image_user}" != "65532:65532" ]]; then
            echo "Image runs as '${image_user}', expected the distroless nonroot user 65532:65532" >&2
            exit 1
          fi
          container="$(docker create "${IMAGE}")"
          trap 'docker rm "${container}" > /dev/null' EXIT
          docker cp "${container}:/usr/share/doc/openai-rust-sdk/sbom.cdx.json" "${RUNNER_TEMP}/sbom.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' "${RUNNER_TEMP}/sbom.cdx.json" > /dev/null

      - name: Test container health check
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker run -d --name test-container "${IMAGE}" --version
          sleep 5
          docker inspect test-container
          docker stop test-container || true
          docker rm test-container || true

  sign:
    name: Sign Container
    needs: [merge, scan, test]
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    if: >-
      !cancelled() && needs.merge.result == 'success' && needs.scan.result == 'success' &&
      needs.test.result == 'success' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.merge.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Signs the multi-arch index; `cosign verify` on any of its tags checks
      # this signature.
      - name: Sign container image
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${GITHUB_REPOSITORY,,}@${DIGEST}"

      # Docker Hub holds the same index digest (the merge job checks it); it is
      # signed in this job, so its signature carries the same keyless identity.
      - name: Sign Docker Hub image
        if: needs.merge.outputs.dockerhub_enabled == 'true'
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          image="${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/$(tr '[:upper:]_' '[:lower:]-' <<< "${repo_name}")"
          cosign sign --yes "${image}@${DIGEST}"

  sbom:
    name: Generate SBOM
    needs: merge
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read # Pull the pushed image from GHCR.
    steps:
      - name: Image reference
        id: image
        run: echo "ref=${REGISTRY}/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.ref }}
          artifact-name: sbom.spdx.json
          format: spdx-json
        continue-on-error: true

  docker-success:
    name: Docker Build Success
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    needs: [build, merge, scan, test]
    if: always()
    steps:
      - name: Check results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          MERGE_RESULT: ${{ needs.merge.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "Docker build failed"
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" && "${MERGE_RESULT}" != "success" ]]; then
            echo "Publishing the multi-arch image failed"
            exit 1
          fi
          if [[ "${SCAN_RESULT}" != "success" ]]; then
            echo "Security scan did not complete successfully"
            exit 1
          fi
          if [[ "${TEST_RESULT}" != "success" ]]; then
            echo "Docker image tests failed"
            exit 1
          fi
          echo "Docker workflow completed successfully"
