name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '30 2 * * 1'  # Weekly on Monday at 2:30 AM UTC
  workflow_dispatch:

# Read-only by default; the coverage job adds the OIDC token Codecov needs.
permissions:
  contents: read

concurrency:
  # GitHub replaces pending runs in the same group even when cancellation is off.
  # Group PR updates together, but give each push its own group for full coverage.
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: 1.100.0

jobs:
  # Comprehensive linting
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          echo "✅ Formatting check passed"
      
      - name: Run clippy with default features
        run: |
          cargo clippy --locked --all-targets -- \
            -D warnings \
            -D clippy::all \
            -D clippy::pedantic \
            -D clippy::nursery \
            -D clippy::cargo \
            -A clippy::multiple_crate_versions \
            -A clippy::module_name_repetitions \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::must_use_candidate

      - name: Run clippy with all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      
      - name: Check for TODO/FIXME comments
        run: |
          ! grep -rn "TODO\|FIXME\|HACK\|XXX" --include="*.rs" src/ || \
          (echo "Found TODO/FIXME comments that should be tracked as issues" && exit 0)

  # Code complexity and maintainability
  complexity:
    name: Code Complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install complexity tools
        run: |
          cargo install tokei --locked --version 15.0.0
          cargo install cargo-geiger --locked --version 0.14.0 || true
      
      - name: Count lines of code
        run: |
          echo "📊 Code Statistics:"
          tokei
      
      - name: Check unsafe code usage
        run: |
          echo "🔒 Unsafe Code Analysis:"
          cargo geiger || true
      
      - name: Count dependencies
        run: |
          echo "📦 Dependency Count:"
          cargo tree | wc -l
      
      - name: Analyze code metrics
        run: |
          echo "📈 Code Metrics:"
          echo "Rust files: $(find . -name '*.rs' -type f | wc -l)"
          echo "Total lines: $(find . -name '*.rs' -type f -exec wc -l {} + | tail -1 | awk '{print $1}')"

  # Documentation quality
  docs-quality:
    name: Documentation Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      
      - name: Check documentation
        run: |
          cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings --cfg docsrs"
      
      - name: Check for missing docs
        run: |
          cargo rustdoc --locked -- \
            -D missing-docs \
            -D rustdoc::missing-crate-level-docs \
            -D rustdoc::missing-doc-code-examples
        continue-on-error: true
      
      - name: Test documentation examples
        run: cargo test --locked --doc
      
      - name: Check README examples
        run: |
          cargo build --locked
          # Extract and test code blocks from README
          echo "Testing README code examples..."

  # Test coverage
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov tokenless upload via OIDC; no CODECOV_TOKEN secret.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
      
      - name: Generate coverage report
        run: |
          cargo llvm-cov --workspace \
            --lcov --output-path lcov.info \
            --ignore-filename-regex '(tests?|examples?|benches?)/'
      
      - name: Generate HTML report
        run: |
          cargo llvm-cov --workspace \
            --html --output-dir coverage \
            --ignore-filename-regex '(tests?|examples?|benches?)/'
      
      # Reads the profile data from the runs above; `--print-summary` is not a
      # cargo-llvm-cov option, so the previous pipeline never checked anything.
      - name: Check coverage threshold
        run: |
          set -euo pipefail
          coverage="$(cargo llvm-cov report --json --summary-only \
            --ignore-filename-regex '(tests?|examples?|benches?)/' | jq -r '.data[0].totals.lines.percent')"
          if awk -v c="${coverage}" 'BEGIN { exit !(c < 60) }'; then
            echo "❌ Line coverage is below 60%: ${coverage}%"
            exit 1
          fi
          echo "✅ Line coverage: ${coverage}%"
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
      
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.2
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
          use_oidc: true

  # Mutation testing
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version 27.1.0
      
      - name: Run mutation tests
        run: |
          cargo mutants --no-shuffle --timeout 60 --jobs 2 || true
      
      - name: Upload mutation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: mutants.out/
        if: always()

  # Performance regression check
  bench-check:
    name: Benchmark Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      
      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run benchmarks
        run: |
          {
            echo "## Benchmark results"
            echo
            echo "Running the checked-in Criterion benchmarks."
          } >> "$GITHUB_STEP_SUMMARY"

          if cargo bench --locked 2>&1 | tee benchmark-output.log; then
            echo "Benchmarks completed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Some benchmarks failed; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo
            echo "The benchmark-results artifact contains the generated Criterion reports."
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: target/criterion
          retention-days: 7
        if: always()

  # Dependency analysis
  deps-analysis:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install analysis tools
        run: |
          cargo install cargo-outdated --locked --version 0.19.0
          cargo install cargo-udeps --locked --version 0.1.61
          cargo install cargo-machete --locked --version 0.9.2
      
      - name: Check for outdated dependencies
        run: |
          echo "📦 Outdated Dependencies:"
          cargo outdated --exit-code 1 || true
      
      - name: Check for unused dependencies
        run: |
          echo "🗑️ Unused Dependencies:"
          cargo machete || true
      
      - name: Check for duplicate dependencies
        run: |
          echo "👥 Duplicate Dependencies:"
          cargo tree --duplicates
      
      - name: Analyze dependency tree
        run: |
          echo "🌳 Dependency Tree Summary:"
          cargo tree --prefix depth

  # Code duplication check
  duplication:
    name: Code Duplication
    runs-on: ubuntu-latest
    # This action requires a PR number and posts its report to that PR.
    # Fork tokens cannot create the report, so keep this write scope on same-repo PRs.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout pinned duplication reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: platisd/duplicate-code-detection-tool
          ref: f0413b1571a98b653f617a59fec0097001e18c0e # v1.2.0
          path: .duplication-tool
          persist-credentials: false

      - name: Build pinned reporter
        run: docker build --tag duplication-reporter .duplication-tool

      - name: Check for code duplication
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_DIRECTORIES: src
          INPUT_IGNORE_DIRECTORIES: ""
          INPUT_PROJECT_ROOT_DIR: ./
          INPUT_FILE_EXTENSIONS: rs
          INPUT_IGNORE_BELOW: "5"
          INPUT_FAIL_ABOVE: "95"
          INPUT_WARN_ABOVE: "15"
          INPUT_ONLY_CODE: "false"
          INPUT_HEADER_MESSAGE_START: "## Duplicate code detection report"
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The upstream entrypoint clones inside its disposable container and
        # silently accepts a rejected comment. Keep message.md in the mounted
        # workspace instead, preserving the original detection exit status.
        run: |
          docker run --rm --entrypoint python3 \
            --volume "$GITHUB_WORKSPACE:/github/workspace" --workdir /github/workspace \
            -e INPUT_GITHUB_TOKEN -e INPUT_DIRECTORIES -e INPUT_IGNORE_DIRECTORIES \
            -e INPUT_PROJECT_ROOT_DIR -e INPUT_FILE_EXTENSIONS -e INPUT_IGNORE_BELOW \
            -e INPUT_FAIL_ABOVE -e INPUT_WARN_ABOVE -e INPUT_ONLY_CODE \
            -e INPUT_HEADER_MESSAGE_START -e GITHUB_REPOSITORY -e GITHUB_API_URL \
            duplication-reporter /action/run_action.py \
            --latest-head "$PR_HEAD" --pull-request-id "$PR_NUMBER"

      - name: Retain complete duplication report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-duplication-report
          path: message.md
          if-no-files-found: error

      - name: Link the retained report in the check summary
        if: always()
        run: |
          test -s message.md
          echo 'The complete duplication report is retained in the code-duplication-report artifact of this run, including when GitHub rejects an oversized PR comment.' >> "$GITHUB_STEP_SUMMARY"

  # Spell check
  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install codespell
        run: pip install --require-hashes -r .github/requirements/codespell.txt

      - name: Run spell check
        run: |
          codespell --skip="target,*.lock,.git" \
                    --ignore-words-list="crate,mut,impl,async,tokio,serde" \
                    --check-filenames \
                    --check-hidden \
                    || true

  # Summary job
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, complexity, docs-quality, coverage, deps-analysis]
    if: always()
    steps:
      - name: Check quality gate
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Linting failed"
            exit 1
          fi
          if [[ "${{ needs.docs-quality.result }}" != "success" ]]; then
            echo "❌ Documentation quality check failed"
            exit 1
          fi
          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "⚠️ Coverage check failed (non-blocking)"
          fi
          echo "✅ Quality gate passed"
