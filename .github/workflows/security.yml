name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '15 3 * * 1'  # Weekly on Monday at 3:15 AM UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Security audit for dependencies
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_VERSION: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      
      - name: Verify YARA-X advisory scope
        run: python3 scripts/check_yara_security.py

      - name: Run cargo audit
        run: cargo audit
      
      - name: Run cargo audit (json output)
        run: cargo audit --json > audit-report.json
        continue-on-error: true
      
      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

  # Dependency license check
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_VERSION: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      
      - name: Create deny.toml if not exists
        run: |
          if [ ! -f deny.toml ]; then
            cat > deny.toml << 'EOF'
          [licenses]
          confidence-threshold = 0.8
          allow = [
            "MIT",
            "Apache-2.0",
            "Apache-2.0 WITH LLVM-exception",
            "BSD-2-Clause",
            "BSD-3-Clause",
            "ISC",
            "Unicode-DFS-2016",
            "CC0-1.0",
          ]
          deny = [
            "GPL-2.0",
            "GPL-3.0",
            "AGPL-3.0",
            "LGPL-2.1",
            "LGPL-3.0",
          ]
          
          [sources]
          unknown-registry = "warn"
          unknown-git = "warn"
          
          [advisories]
          db-path = "~/.cargo/advisory-db"
          db-urls = ["https://github.com/rustsec/advisory-db"]
          yanked = "warn"
          EOF
          fi
      
      - name: Verify YARA-X advisory scope
        run: python3 scripts/check_yara_security.py

      - name: Check licenses
        run: cargo deny check licenses
      
      - name: Check advisories
        run: cargo deny check advisories
      
      - name: Check bans
        run: cargo deny check bans

  # SARIF/CodeQL scanning
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_VERSION: 1.99.0
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: 'rust'
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      
      - name: Build for CodeQL
        run: cargo build --locked --all-features
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  # Native Semgrep replaces the archived semgrep-action Docker wrapper.
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan configured rules
        # Native CI rejects --config with an App token. Always scan the existing
        # rule packs independently, including forks without access to secrets.
        run: |
          env -u SEMGREP_APP_TOKEN semgrep ci \
            --config p/security-audit \
            --config p/secrets \
            --config p/rust \
            --sarif --output semgrep.sarif

      - name: Publish Semgrep policy results
        if: always() && steps.checkout.outcome == 'success' && env.SEMGREP_APP_TOKEN != ''
        run: semgrep ci

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: semgrep-report
          path: semgrep.sarif
          retention-days: 30

  # Supply chain security
  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_VERSION: 1.99.0
      BINARY_NAME: openai_rust_sdk
      SBOM_MANIFEST_PATH: Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install cargo-supply-chain
        run: |
          cargo install cargo-supply-chain --locked --version 0.3.7 || true
      
      - name: Check supply chain
        run: |
          cargo supply-chain update
          cargo supply-chain publishers
        continue-on-error: true
      
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate SBOM
        run: make sbom BINARY_NAME="${BINARY_NAME}" SBOM_MANIFEST_PATH="${SBOM_MANIFEST_PATH}"
      
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom/*.json
          retention-days: 30

  # Secret scanning
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Fetch all history for secret scanning
      
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
          extra_args: --debug --only-verified
      
      - name: Gitleaks
        if: env.GITLEAKS_LICENSE != ''
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ env.GITLEAKS_LICENSE }}

      - name: Skip Gitleaks when license is unavailable
        if: env.GITLEAKS_LICENSE == ''
        run: echo "Skipping Gitleaks because GITLEAKS_LICENSE is not configured for this run."
          
  # OWASP dependency check
  owasp:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600  # 1.1.0
        with:
          project: 'openai-rust-sdk'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --enableExperimental
      
      - name: Upload OWASP results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: owasp-report
          path: reports/
          retention-days: 30
      
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/dependency-check-report.sarif
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''

  # NOTE: Container image scanning lives in the Docker workflow
  # (.github/workflows/docker.yml -> "scan" job), which reuses the image already
  # built by that pipeline. The previous duplicate container-scan job here scanned
  # a second, separately-built image and double-counted every OS-package CVE in the
  # code-scanning dashboard, so it was removed.

  # Security scorecard
  scorecard:
    name: Security Scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      
      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
