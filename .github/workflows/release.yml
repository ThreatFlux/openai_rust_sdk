name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example, 1.6.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.97.1

jobs:
  verify-package:
    name: Verify Package
    runs-on: ubuntu-latest
    outputs:
      tag_object: ${{ steps.provenance.outputs.tag_object }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Verify release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          PACKAGE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ -n "$REQUESTED_VERSION" && "$PACKAGE_VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "Cargo.toml version $PACKAGE_VERSION does not match requested version $REQUESTED_VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            EXPECTED_TAG="v${PACKAGE_VERSION}"
            if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
              echo "Release tag must be exactly $EXPECTED_TAG, got $GITHUB_REF_NAME" >&2
              exit 1
            fi
          fi
          if ! grep -Fq "## [$PACKAGE_VERSION] -" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a dated $PACKAGE_VERSION release entry" >&2
            exit 1
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release provenance
        id: provenance
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --no-tags origin main
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "$TAG_REF")" != "tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME must be annotated" >&2
            exit 1
          fi
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_REF")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release commit $TAG_COMMIT is not reachable from origin/main" >&2
            exit 1
          fi
          echo "tag_object=$(git rev-parse "$TAG_REF")" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked

      - name: Run documentation tests
        run: cargo test --doc --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps --locked

      - name: Build examples
        run: cargo build --examples --all-features --locked

      - name: Verify package contents
        run: python3 scripts/check_package.py

      - name: Verify crate package
        run: cargo package --all-features --locked

      - name: Verify crates.io publish
        run: cargo publish --all-features --dry-run --locked

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: verify-package
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: crates-io
      url: https://crates.io/crates/openai_rust_sdk
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck immutable release ref
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.verify-package.outputs.tag_object }}
        shell: bash
        run: |
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          REMOTE_TAG_OBJECT=$(git ls-remote --tags origin "$TAG_REF" | awk 'NR == 1 { print $1 }')
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$REMOTE_TAG_OBJECT" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag $GITHUB_REF_NAME changed or disappeared after verification" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "Missing CARGO_REGISTRY_TOKEN" >&2
            exit 1
          fi
          cargo publish --all-features --locked

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify-package, publish-crate]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        env:
          RELEASE_VERSION: ${{ needs.verify-package.outputs.version }}
        shell: bash
        run: |
          awk -v heading="## [$RELEASE_VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "Release $RELEASE_VERSION" > RELEASE_NOTES.md
          fi

      - name: Recheck immutable release ref
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.verify-package.outputs.tag_object }}
        shell: bash
        run: |
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          REMOTE_TAG_OBJECT=$(git ls-remote --tags origin "$TAG_REF" | awk 'NR == 1 { print $1 }')
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$REMOTE_TAG_OBJECT" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag $GITHUB_REF_NAME changed or disappeared after publication" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
