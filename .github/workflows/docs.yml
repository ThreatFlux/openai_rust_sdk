name: Documentation

on:
  push:
    branches: [main, develop]
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'FEATURES.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'examples/**'
      - 'scripts/check_docs.py'
      - 'src/**/*.rs'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'FEATURES.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'examples/**'
      - 'scripts/check_docs.py'
      - 'src/**/*.rs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10

jobs:
  contract:
    name: Documentation Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate README and local links
        run: python3 scripts/check_docs.py

      - name: Create markdownlint configuration
        id: markdownlint-config
        shell: bash
        run: |
          config_path="${RUNNER_TEMP}/markdownlint.jsonc"
          printf '%s\n' \
            '{' \
            '  "MD013": false,' \
            '  "MD024": { "siblings_only": true },' \
            '  "MD034": false' \
            '}' > "${config_path}"
          echo "path=${config_path}" >> "${GITHUB_OUTPUT}"

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@3b11e4c3e2eac5207914843511bd517908954018 # v24.1.0
        with:
          config: ${{ steps.markdownlint-config.outputs.path }}
          globs: |
            README.md
            CONTRIBUTING.md
            FEATURES.md
            SECURITY.md
            docs/**/*.md
            !CHANGELOG.md
            !docs/BRANCH_PROTECTION.md

      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --scheme https
            --scheme http
            --max-retries 3
            --retry-wait-time 2
            --timeout 30
            --accept '100..=103,200..=299,429'
            README.md
            CHANGELOG.md
            CONTRIBUTING.md
            FEATURES.md
            SECURITY.md
            'docs/**/*.md'
          fail: true
          failIfEmpty: true
          lycheeVersion: v0.24.2
          token: ${{ secrets.GITHUB_TOKEN }}

  quickstart:
    name: Quickstart (${{ matrix.channel }})
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [msrv, stable]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve Rust toolchain
        id: toolchain
        shell: bash
        run: |
          if [[ "${{ matrix.channel }}" == "msrv" ]]; then
            value="$(python3 scripts/check_docs.py --print-msrv)"
          else
            value="stable"
          fi
          echo "value=${value}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.value }}

      - name: Cache Cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-${{ matrix.channel }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-docs-${{ matrix.channel }}-

      - name: Compile quickstart
        env:
          RUST_TOOLCHAIN: ${{ steps.toolchain.outputs.value }}
        run: cargo +"${RUST_TOOLCHAIN}" check --locked --example quickstart

  rustdoc-and-cli:
    name: Rustdoc and CLI
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install current stable Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # v1
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-rustdoc-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-docs-rustdoc-

      - name: Build CLI with YARA support
        run: cargo +stable build --locked --features yara --bin openai_rust_sdk

      - name: Smoke-test CLI argument help
        run: |
          target/debug/openai_rust_sdk --help
          target/debug/openai_rust_sdk validate-rule --help
          target/debug/openai_rust_sdk generate-batch --help
          target/debug/openai_rust_sdk run-tests --help

      - name: Build API documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --all-features --no-deps
