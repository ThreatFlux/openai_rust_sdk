# Dependabot configuration for automated dependency updates
# See: https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates

version: 2
multi-ecosystem-groups:
  nightly:
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "UTC"
    commit-message:
      prefix: "chore"
      include: "scope"

updates:
  # Rust dependencies (Cargo): root and independent fuzz workspaces
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/fuzz"
    patterns: ["*"]
    multi-ecosystem-group: "nightly"
    labels:
      - "dependencies"
      - "rust"
    allow:
      - dependency-type: "all"
    rebase-strategy: "auto"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "nightly"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "nightly"
    labels:
      - "dependencies"
      - "docker"

# GitHub repository settings control Dependabot security updates.
