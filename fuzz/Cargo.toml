[package]
name = "openai-sdk-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
serde_json = "1.0.154"
openai_rust_sdk = { path = "..", default-features = false }

[[bin]]
name = "response-json"
path = "fuzz_targets/response_json.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
