# Exceptions apply only to the graph verified by scripts/check_yara_security.py.
# See docs/configuration.md for advisory/source evidence and downstream caveats.

[advisories]
ignore = [
    # YARA-X 1.21.0 only verifies public RSA signatures; no private-key operations.
    "RUSTSEC-2023-0071",
    # Bincode 2.0.1 is unmaintained; stable YARA-X has no replacement yet.
    "RUSTSEC-2025-0141",
    # YARA-X uses one global Engine for its modules and stores.
    "RUSTSEC-2026-0222",
    # No wasmtime-wasi/cap-std dependency or filesystem guest imports.
    "RUSTSEC-2026-0269",
    # Wasmtime component-model is disabled; component::Val is unavailable.
    "RUSTSEC-2026-0316",
    # Wasmtime component-model-async is disabled (upstream workaround).
    "RUSTSEC-2026-0327",
]
